[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    ollama: 実 Ollama 起動が必要なテスト
    gpu: GPU (CUDA/DirectML) が必要なテスト
    slow: 実行に時間がかかるテスト（Embedding ロード等）
    ui: PyQt6 UI 結合テスト
    e2e: 実アプリ起動の E2E テスト
timeout = 120
